# Kustomization overlay for local development
# Use this when building images locally with: make docker-build
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# For local development, use locally built images with :dev tag
images:
  - name: ghcr.io/zwindler/podsweeper-gamemaster
    newName: ghcr.io/zwindler/podsweeper-gamemaster
    newTag: dev
  - name: ghcr.io/zwindler/podsweeper-hint-agent
    newName: ghcr.io/zwindler/podsweeper-hint-agent
    newTag: dev
  - name: ghcr.io/zwindler/podsweeper-player-terminal
    newName: ghcr.io/zwindler/podsweeper-player-terminal
    newTag: dev

# Patch the deployment for local development
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "ghcr.io/zwindler/podsweeper-hint-agent:dev"
    target:
      kind: Deployment
      name: gamemaster
