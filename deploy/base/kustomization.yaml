# Kustomization for PodSweeper base resources
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: podsweeper-game

resources:
  - namespace.yaml
  - gamemaster-rbac.yaml
  - gamemaster-deployment.yaml
  - player-rbac.yaml
  - player-terminal.yaml
  - game-config.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: podsweeper
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

images:
  - name: ghcr.io/zwindler/podsweeper-gamemaster
    newTag: dev
  - name: ghcr.io/zwindler/podsweeper-hint-agent
    newTag: dev
  - name: ghcr.io/zwindler/podsweeper-player-terminal
    newTag: dev

# Patch to use :dev tag for hint-agent env var (kustomize images only transforms container images)
patches:
  - target:
      kind: Deployment
      name: gamemaster
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "ghcr.io/zwindler/podsweeper-hint-agent:dev"
