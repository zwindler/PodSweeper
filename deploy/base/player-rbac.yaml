# PodSweeper Player ServiceAccount
# Players use this identity to interact with the game
# Their permissions are restricted based on the current level
apiVersion: v1
kind: ServiceAccount
metadata:
  name: player
  namespace: podsweeper-game
  labels:
    app.kubernetes.io/name: podsweeper
    app.kubernetes.io/component: player
---
# Role for players - Level 0 (The Intern)
# Full access to "cheat" - can read the map ConfigMap directly
#
# As levels progress, the Gamemaster will update this Role to remove permissions:
#   Level 1: Remove configmaps access (map moves to Secret)
#   Level 2: Remove secrets access (map moves to pod env)
#   Level 3: Remove exec on non-player pods (map in gamemaster only)
#   Level 4+: Minimal permissions only
#
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: podsweeper-player
  namespace: podsweeper-game
  labels:
    app.kubernetes.io/name: podsweeper
    app.kubernetes.io/component: player
rules:
  # Core gameplay: see and delete pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]

  # Port-forward to hint pods (to read hint values)
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]

  # View pod logs (for hint pods, explosion, victory messages)
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Exec into pods (needed for Level 2 cheat path)
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]

  # Read ConfigMaps (Level 0 cheat: map ConfigMap)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]

  # Read Secrets (Level 1 cheat: map Secret)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

  # View events (useful for debugging, required for Level 9)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
# Bind the Role to the player ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: podsweeper-player
  namespace: podsweeper-game
  labels:
    app.kubernetes.io/name: podsweeper
    app.kubernetes.io/component: player
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: podsweeper-player
subjects:
  - kind: ServiceAccount
    name: player
    namespace: podsweeper-game
