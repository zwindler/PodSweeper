# PodSweeper Gamemaster ServiceAccount
# The gamemaster controller runs with this identity
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gamemaster
  namespace: podsweeper-game
  labels:
    app.kubernetes.io/name: podsweeper
    app.kubernetes.io/component: gamemaster
---
# ClusterRole for the gamemaster
# Needs to manage pods, secrets, and watch events in the game namespace
# Also needs all permissions it may grant to players (RBAC escalation prevention)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: podsweeper-gamemaster
  labels:
    app.kubernetes.io/name: podsweeper
    app.kubernetes.io/component: gamemaster
rules:
  # Core pod management for game cells
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pod subresources - needed to grant these to players
  - apiGroups: [""]
    resources: ["pods/exec", "pods/log", "pods/portforward"]
    verbs: ["get", "create"]
  # Secret management for game state persistence
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ConfigMap management for game configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Events for debugging, observability, and player access
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  # Namespace access (for multi-game support)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Role management for dynamic RBAC per level
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
# Bind the ClusterRole to the gamemaster ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: podsweeper-gamemaster
  labels:
    app.kubernetes.io/name: podsweeper
    app.kubernetes.io/component: gamemaster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: podsweeper-gamemaster
subjects:
  - kind: ServiceAccount
    name: gamemaster
    namespace: podsweeper-game
